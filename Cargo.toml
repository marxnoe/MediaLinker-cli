[package]
name = "medialinker-cli"
version = "0.6.4"
edition = "2024"
description = "Share files and text through MediaLinker with 5-character codes, and keep one clipboard on all your devices"
repository = "https://github.com/marxnoe/MediaLinker-cli"
homepage = "https://github.com/marxnoe/MediaLinker-cli"
license = "MIT"
readme = "README.md"
keywords = ["medialinker", "share", "cli", "upload", "clipboard"]
categories = ["command-line-utilities"]
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE*"]

[[bin]]
name = "ml"
path = "src/main.rs"

# Lets `cargo binstall medialinker-cli` fetch the prebuilt cargo-dist archives.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
aes-gcm = "0.10"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
ctrlc = { version = "3.5.2", features = ["termination"] }
curve25519-dalek = "5"
dirs = "7.0.0"
gethostname = "1.1.0"
getrandom = "0.3"
hmac = "0.13.0"
png = "0.18.1"
qrcode = { version = "0.14.1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.5.0", features = ["json", "platform-verifier"] }
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9"
x11rb = { version = "0.13", features = ["xfixes"] }

[target."cfg(windows)".dependencies]
clipboard-win = { version = "5.4", features = ["std"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_DataExchange"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
