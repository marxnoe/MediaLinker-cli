[package]
name = "medialinker-cli"
version = "0.2.0"
edition = "2024"
description = "Share files and text through MediaLinker with 5-character codes"
repository = "https://github.com/marxnoe/MediaLinker-cli"
homepage = "https://github.com/marxnoe/MediaLinker-cli"
readme = "README.md"
keywords = ["medialinker", "share", "cli", "upload"]
categories = ["command-line-utilities"]
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE*"]

[[bin]]
name = "ml"
path = "src/main.rs"

# Lets `cargo binstall medialinker-cli` fetch the prebuilt cargo-dist archives.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
